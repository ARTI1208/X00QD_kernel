name: Build kernel

on:
  workflow_dispatch:

jobs:
  build_kernel:
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install python2
        run: |
          sudo apt install -y python2
      - name: Build kernel
        id: build_kernel
        run: |
          make ARCH=arm64 O=build ze620kl-user-sdm660-perf_defconfig
          make -j4 O=build ARCH=arm64 DEFCONFIG=ze620kl-user-sdm660-perf_defconfig ASUS_BUILD_PROJECT=ZE620KL KBUILD_CFLAGS="-Wno-error"
